name: Build and release on main

on:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 6:07am UTC — rebuild with latest RPMs from Fedora base
    # Offset from :00 to reduce GitHub Actions queue delays
    - cron: '7 6 * * 1'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: read

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Workaround open podman-login action issue
      env:
        auth: '{ "auths": {} }'
      run: |
        mkdir -p $HOME/.docker
        echo $auth > $HOME/.docker/config.json

    - name: Build Image
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: test ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Test container functionality
      run: |
        IMAGE_NAME="${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Testing built image: $IMAGE_NAME"
        podman image inspect "$IMAGE_NAME" --format '{{.Id}}'

        CONTAINER=$(buildah from "$IMAGE_NAME")
        MOUNT=$(buildah mount $CONTAINER)

        test -x "$MOUNT/usr/local/bin/wifi-setup.sh"
        test -x "$MOUNT/usr/local/bin/tailscale-setup.sh"
        test -f "$MOUNT/etc/containers/systemd/node-exporter.container"
        test -f "$MOUNT/etc/containers/policy.json"
        test -f "$MOUNT/usr/share/pki/sigstore/cosign.pub"
        chroot "$MOUNT" rpm -q tailscale NetworkManager-wifi podman >/dev/null

        buildah unmount $CONTAINER
        buildah rm $CONTAINER

        echo "All container functionality tests passed"

  release:
    name: Semantic Release
    needs: build
    uses: tempest-concorde/fw-cicd/.github/workflows/semantic-release.yml@main
    with:
      use_local_config: false
    secrets: inherit
