name: Build, release, and publish on main

on:
  push:
    branches:
      - main

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: read

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Workaround open podman-login action issue
      env:
        auth: '{ "auths": {} }'
      run: |
        mkdir -p $HOME/.docker
        echo $auth > $HOME/.docker/config.json

    - name: Build Image
      uses: redhat-actions/buildah-build@v2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: test ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Test container functionality
      run: |
        IMAGE_NAME="${{ env.IMAGE_NAME }}:${{ github.sha }}"
        echo "Testing built image: $IMAGE_NAME"
        podman image inspect "$IMAGE_NAME" --format '{{.Id}}'

        CONTAINER=$(buildah from "$IMAGE_NAME")
        MOUNT=$(buildah mount $CONTAINER)

        test -x "$MOUNT/usr/local/bin/wifi-setup.sh"
        test -x "$MOUNT/usr/local/bin/tailscale-setup.sh"
        test -f "$MOUNT/etc/containers/systemd/node-exporter.container"
        test -f "$MOUNT/etc/containers/policy.json"
        test -f "$MOUNT/usr/share/pki/sigstore/cosign.pub"
        chroot "$MOUNT" rpm -q tailscale NetworkManager-wifi podman >/dev/null

        buildah unmount $CONTAINER
        buildah rm $CONTAINER

        echo "All container functionality tests passed"

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Semantic Release
      id: release
      run: npx semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-24.04-arm
    needs: [build, release]
    if: needs.release.outputs.new_release_published == 'true'
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Workaround open podman-login action issue
      env:
        auth: '{ "auths": {} }'
      run: |
        mkdir -p $HOME/.docker
        echo $auth > $HOME/.docker/config.json

    - name: Log in to GHCR
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ${{ env.IMAGE_REGISTRY }}
        auth_file_path: /run/containers/0/auth.json

    - name: Build container image
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: latest ${{ needs.release.outputs.new_release_version }} ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Push to GHCR
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ needs.release.outputs.new_release_version }} ${{ github.sha }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.7.0

    - name: Get image digest
      id: digest
      run: |
        DIGEST=$(podman image inspect --format '{{ .Digest }}' ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }})
        echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT
        echo "Image digest: $DIGEST"

    - name: Sign image with cosign
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --recursive \
          -a tag=${{ needs.release.outputs.new_release_version }} \
          -a sha=${{ github.sha }} \
          -a run_id=${{ github.run_id }} \
          -a run_attempt=${{ github.run_attempt }} \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}

    - name: Verify signature
      env:
        COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
      run: |
        echo "$COSIGN_PUBLIC_KEY" > /tmp/cosign.pub
        cosign verify \
          --key /tmp/cosign.pub \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}
        rm -f /tmp/cosign.pub
