name: Publish on tag

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Log in to GHCR
      run: |
        podman login ${{ env.IMAGE_REGISTRY }} \
          -u ${{ github.actor }} \
          -p "${{ secrets.GITHUB_TOKEN }}" \
          --compat-auth-file $HOME/.docker/config.json

    - name: Build container image
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Push to GHCR
      uses: redhat-actions/push-to-registry@v3
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Install Cosign v2.2.4
      run: |
        curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-arm64 -o /usr/local/bin/cosign
        chmod +x /usr/local/bin/cosign
        cosign version

    - name: Get image digest from registry
      id: digest
      run: |
        DIGEST=$(skopeo inspect --authfile $HOME/.docker/config.json \
          docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} \
          --format '{{ .Digest }}')
        echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT
        echo "Image digest: $DIGEST"

    - name: Sign image with cosign
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --tlog-upload=false \
          -a tag=${{ steps.version.outputs.VERSION }} \
          -a sha=${{ github.sha }} \
          -a run_id=${{ github.run_id }} \
          -a run_attempt=${{ github.run_attempt }} \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}

  dispatch:
    name: Trigger fw-os rebuild
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: tempest-concorde
          repositories: fw-os

      - name: Dispatch base-image-updated to fw-os
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/tempest-concorde/fw-os/dispatches \
            --method POST \
            --field event_type=base-image-updated \
            --field 'client_payload[version]=${{ github.ref_name }}'
