name: Publish on tag

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag version: $VERSION"

    - name: Workaround open podman-login action issue
      env:
        auth: '{ "auths": {} }'
      run: |
        mkdir -p $HOME/.docker
        echo $auth > $HOME/.docker/config.json

    - name: Log in to GHCR
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ${{ env.IMAGE_REGISTRY }}
        auth_file_path: /run/containers/0/auth.json

    - name: Build container image
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Push to GHCR
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.7.0

    - name: Get image digest
      id: digest
      run: |
        DIGEST=$(podman image inspect --format '{{ .Digest }}' ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }})
        echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT
        echo "Image digest: $DIGEST"

    - name: Sign image with cosign
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --recursive \
          -a tag=${{ steps.version.outputs.VERSION }} \
          -a sha=${{ github.sha }} \
          -a run_id=${{ github.run_id }} \
          -a run_attempt=${{ github.run_attempt }} \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}

    - name: Verify signature
      env:
        COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
      run: |
        echo "$COSIGN_PUBLIC_KEY" > /tmp/cosign.pub
        cosign verify \
          --key /tmp/cosign.pub \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}
        rm -f /tmp/cosign.pub
