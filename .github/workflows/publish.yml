name: Publish on tag

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.digest.outputs.IMAGE_DIGEST }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Extract version from tag
      id: version
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Publishing version: $VERSION"

    - name: Log in to GHCR
      run: |
        podman login ${{ env.IMAGE_REGISTRY }} \
          -u ${{ github.actor }} \
          -p "${{ secrets.GITHUB_TOKEN }}" \
          --compat-auth-file $HOME/.docker/config.json

    - name: Build container image
      id: build-image
      uses: redhat-actions/buildah-build@v3
      with:
        image: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Push to GHCR
      uses: redhat-actions/push-to-registry@v3
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Install Cosign v2.2.4
      run: |
        curl -sSfL https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-arm64 -o /usr/local/bin/cosign
        chmod +x /usr/local/bin/cosign
        cosign version

    - name: Get image digest from registry
      id: digest
      run: |
        DIGEST=$(skopeo inspect --authfile $HOME/.docker/config.json \
          docker://${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} \
          --format '{{ .Digest }}')
        echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT
        echo "Image digest: $DIGEST"

    - name: Sign image with cosign
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --tlog-upload=false \
          -a tag=${{ steps.version.outputs.VERSION }} \
          -a sha=${{ github.sha }} \
          -a run_id=${{ github.run_id }} \
          -a run_attempt=${{ github.run_attempt }} \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}

  dispatch:
    name: Trigger fw-os rebuild
    needs: publish
    uses: tempest-concorde/fw-cicd/.github/workflows/cascade-dispatch.yml@main
    with:
      downstream_repo: tempest-concorde/fw-os
      event_type: base-image-updated
      client_payload: >-
        {"version":"${{ needs.publish.outputs.version }}","digest":"${{ needs.publish.outputs.image_digest }}","registry":"ghcr.io","image":"tempest-concorde/fedora-bootc-pi","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
    secrets: inherit

  sbom:
    name: SBOM attestation
    needs: publish
    uses: tempest-concorde/fw-cicd/.github/workflows/sbom-attest.yml@main
    with:
      registry: ghcr.io
      image_name: tempest-concorde/fedora-bootc-pi
      image_digest: ${{ needs.publish.outputs.image_digest }}
      version: ${{ github.ref_name }}
      is_release: true
      signing_mode: key
    secrets: inherit
