name: Publish on release

on:
  workflow_run:
    workflows: ["Build and release on main"]
    types:
      - completed
    branches:
      - main

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: tempest-concorde/fedora-bootc-pi

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    # Only run if the upstream workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Get container tools in UBI builder
      run: dnf -y install podman buildah skopeo make wget git

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for new tag and extract version
      id: version
      run: |
        # Find the most recent tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

        if [ -z "$LATEST_TAG" ]; then
          echo "No tags found, skipping publish"
          echo "SKIP_PUBLISH=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Check if this tag was created recently (within last 2 minutes)
        TAG_DATE=$(git log -1 --format=%ct "$LATEST_TAG")
        CURRENT_TIME=$(date +%s)
        TIME_DIFF=$((CURRENT_TIME - TAG_DATE))

        if [ $TIME_DIFF -gt 120 ]; then
          echo "Latest tag $LATEST_TAG is too old ($TIME_DIFF seconds), skipping publish"
          echo "SKIP_PUBLISH=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Extract version and checkout the tag
        git checkout "$LATEST_TAG"
        VERSION="${LATEST_TAG#v}"
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "SKIP_PUBLISH=false" >> $GITHUB_OUTPUT
        echo "Publishing tag: $LATEST_TAG (version: $VERSION)"

    - name: Workaround open podman-login action issue
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      env:
        auth: '{ "auths": {} }'
      run: |
        mkdir -p $HOME/.docker
        echo $auth > $HOME/.docker/config.json

    - name: Log in to GHCR
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      uses: redhat-actions/podman-login@v1
      with:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        registry: ${{ env.IMAGE_REGISTRY }}
        auth_file_path: /run/containers/0/auth.json

    - name: Build container image
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      id: build-image
      uses: redhat-actions/buildah-build@v2
      with:
        image: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        platforms: linux/arm64
        containerfiles: |
          ./Containerfile

    - name: Push to GHCR
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      uses: redhat-actions/push-to-registry@v2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: latest ${{ steps.version.outputs.VERSION }} ${{ github.sha }}
        registry: ${{ env.IMAGE_REGISTRY }}

    - name: Install Cosign
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      uses: sigstore/cosign-installer@v3.7.0

    - name: Get image digest
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      id: digest
      run: |
        DIGEST=$(podman image inspect --format '{{ .Digest }}' ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }})
        echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_OUTPUT
        echo "Image digest: $DIGEST"

    - name: Sign image with cosign
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --recursive \
          -a tag=${{ steps.version.outputs.VERSION }} \
          -a sha=${{ github.sha }} \
          -a run_id=${{ github.run_id }} \
          -a run_attempt=${{ github.run_attempt }} \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}

    - name: Verify signature
      if: steps.version.outputs.SKIP_PUBLISH != 'true'
      env:
        COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
      run: |
        echo "$COSIGN_PUBLIC_KEY" > /tmp/cosign.pub
        cosign verify \
          --key /tmp/cosign.pub \
          ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.IMAGE_DIGEST }}
        rm -f /tmp/cosign.pub
